# Builds the Good Outside planner as a static site and deploys it to your own Cloudflare account.
# Manual only (Actions → Deploy Good Outside web → Run workflow). The deploy step refuses to run
# unless a Cloudflare Access application with an email allow policy protects the hostname.
#
# Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GOOD_OUTSIDE_HOSTNAME.
# See apps/good-outside/artifact/web/README.md.
name: Deploy Good Outside web

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: good-outside-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/good-outside/artifact
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Download catalog snapshots (checked against data/snapshots.json)
        working-directory: .
        run: npm run data:download
      - run: npm ci
      - name: Fetch pinned map data and terrain tiles
        run: node fetch-data.mjs && node fetch-terrain.mjs
      - run: npm test
      - name: Build
        run: node build.mjs && node build-web.mjs
      - name: Deploy behind Cloudflare Access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOD_OUTSIDE_HOSTNAME: ${{ secrets.GOOD_OUTSIDE_HOSTNAME }}
        run: node web/deploy.mjs
